    - name: "Install Dafny"
      uses: dafny-lang/setup-dafny-action@v1
      with:
        dafny-version: "4.11.0"
    - name: Build C#
      run: |
        cd target/cs
        dafny build --no-verify --target=cs src/dfyconfig.toml --output bin/b3

    - name: Test C# stdin
      run: |
        cat test/parser/stdin-parse.b3 | target/cs/bin/b3 parse --stdin --print > /tmp/output.txt
        diff test/parser/stdin-parse.b3.expect /tmp/output.txt
